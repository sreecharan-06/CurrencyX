<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  <rect width="100" height="100" rx="24" stroke="url(#gradPrimary)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#gradGlow)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.6" />

  <!-- Dynamic Currency Exchange Glyphs forming an 'X' & arrows -->
  <!-- Upper Right Arrow -->
  <path d="M42 34 L58 34 M58 34 L58 50 M58 34 L32 60" stroke="url(#gradPrimary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Lower Left Arrow -->
  <path d="M58 66 L42 66 M42 66 L42 50 M42 66 L68 40" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Currency Core Pulse -->
  <circle cx="50" cy="50" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
